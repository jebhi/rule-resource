# Mihomo（Clash Meta）配置，由 config/surge.conf 转换而来，策略组和规则与 Surge 保持一致
# 使用前：把下面 proxy-providers 里的 url 换成你的 Clash 订阅链接
#        （不要把真实订阅提交到这个公开仓库）

mixed-port: 7890
socks-port: 6153
allow-lan: true
bind-address: "*"
mode: rule
log-level: warning
ipv6: false
external-controller: 127.0.0.1:9090
secret: examplepassword   # 换成你自己的密码

profile:
  store-selected: true

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "time.*.com"
    - "+.ntp.org"
  use-hosts: true
  use-system-hosts: true
  default-nameserver:
    - 223.5.5.5
  nameserver:
    - https://223.6.6.6/dns-query
    - https://doh.pub/dns-query

hosts:
  "mtalk.google.com": 108.177.125.188
  "tagss13.pro": 104.26.5.84
  "tagxx.vip": 103.135.249.37

proxy-providers:
  订阅:
    type: http
    url: "https://example.com/替换成你的Clash订阅链接"
    path: ./proxy_providers/subscription.yaml
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 600

rule-providers:
  meta:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/jebhi/rule-resource/main/rules/classical/meta.list
    path: ./ruleset/meta.list
    interval: 86400

proxy-groups:
  - name: "默认节点"
    type: select
    proxies:
      - "DIRECT"
